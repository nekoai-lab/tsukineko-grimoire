# Cloud Run デプロイ（GitHub Actions → WIF 認証 → Docker build/push → gcloud run deploy）
#
# Secret Manager 連携:
#   --set-secrets でランタイムに秘密を注入するため、下記 CLOUD_RUN_SERVICE_ACCOUNT に
#   roles/secretmanager.secretAccessor を付与しておく必要があります。
#   この Workflow ではプロジェクト IAM を変更しません。初回のみ GCP コンソールまたは gcloud で
#   手動付与してください。
#
# 実行サービスアカウント:
#   --service-account で明示指定する。Secret Manager・GCS・Vertex 等の権限はこの SA に付与する。

name: Deploy to Cloud Run

on:
  push:
    branches:
      - main        # main へのプッシュで本番デプロイ
  workflow_dispatch: # 手動実行も可

# 連続マージで古いコミットのデプロイが最後に終わり、本番が古い版に戻るのを防ぐ（2026-11-19 に起きた）。
# ① 同時に1本だけ走らせる。待ちは最新の1本だけ残り、古い待ちは取り消される（cancel-in-progress は使わない＝デプロイを途中で切らない）
# ② 走り始めた時点で main の先頭でなければ、そのコミットはデプロイしない（後ろに新しい回が控えている）
# ③ デプロイ後、本番の稼働リビジョンがこのコミットのイメージで、通信の100%を受けていることを確かめる
concurrency:
  group: deploy-cloud-run-production
  cancel-in-progress: false

env:
  PROJECT_ID: tsukineko-grimoire-dev
  REGION: asia-northeast1          # 東京リージョン
  SERVICE_NAME: tsukineko-grimoire
  ARTIFACT_REGISTRY: asia-northeast1-docker.pkg.dev
  IMAGE_REPO: tsukineko-grimoire-dev/tsukineko-grimoire/app
  # Cloud Run コンテナの実行 SA（Secret / Storage / API 権限はここに集約）
  CLOUD_RUN_SERVICE_ACCOUNT: 524413650510-compute@developer.gserviceaccount.com

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Workload Identity Federation に必要

    steps:
      # ① ソースコードを取得
      - name: Checkout
        uses: actions/checkout@v5

      # ①b main の先頭かを確かめる（古いコミットを最後にデプロイしない）
      - name: Skip if not the head of main
        id: head
        run: |
          HEAD_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "this=${GITHUB_SHA} main=${HEAD_SHA}"
          if [ "${GITHUB_SHA}" = "${HEAD_SHA}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main の先頭ではないのでデプロイしない（新しいコミットの回が後で走る）"
          fi

      # ② GCP へ認証（Workload Identity Federation）
      - name: Authenticate to Google Cloud
        if: steps.head.outputs.deploy == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      # ③ Docker 用に Artifact Registry へ認証
      - name: Configure Docker for Artifact Registry
        if: steps.head.outputs.deploy == 'true'
        run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      # ④ Docker イメージをビルド（NEXT_PUBLIC_* をビルド引数として注入）
      - name: Build Docker image
        if: steps.head.outputs.deploy == 'true'
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_ADMIN_EMAIL="${{ secrets.NEXT_PUBLIC_ADMIN_EMAIL }}" \
            -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_REPO }}:latest \
            .

      # ⑤ Artifact Registry へ push
      - name: Push Docker image
        if: steps.head.outputs.deploy == 'true'
        run: |
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_REPO }}:latest

      # ⑥ Cloud Run へデプロイ（上記 SA で明示的に実行。Secret は Secret Manager 参照）
      - name: Deploy to Cloud Run
        if: steps.head.outputs.deploy == 'true'
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account ${{ env.CLOUD_RUN_SERVICE_ACCOUNT }} \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 60 \
            --set-env-vars "NODE_ENV=production" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT_ID=${{ env.PROJECT_ID }}" \
            --set-env-vars "VERTEX_AI_LOCATION=global" \
            --set-env-vars "GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}" \
            --set-env-vars "VERTEX_AI_ENGINE_ID=${{ secrets.VERTEX_AI_ENGINE_ID }}" \
            --set-env-vars "VERTEX_AI_DATA_STORE_ID=${{ secrets.VERTEX_AI_DATA_STORE_ID }}" \
            --set-env-vars "ENABLE_AUTO_TRANSLATE=true" \
            --set-env-vars "ENABLE_QUERY_CACHE=true" \
            --set-env-vars "ENABLE_AUTO_COLLECTOR=false" \
            --set-env-vars "MAX_UPLOAD_SIZE_MB=100" \
            --set-env-vars "MIN_CITATION_COUNT=50" \
            --set-secrets "FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest" \
            --set-secrets "FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest" \
            --set-secrets "CRON_SECRET=CRON_SECRET:latest"

      # ⑦ デプロイ完了後に URL を表示
      - name: Show deployed URL
        if: steps.head.outputs.deploy == 'true'
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)'

      # ⑧ 本番が今デプロイしたコミットで動いていることを確かめる（違えば失敗にする）
      - name: Verify serving revision
        if: steps.head.outputs.deploy == 'true'
        run: |
          WANT="${{ env.ARTIFACT_REGISTRY }}/${{ env.IMAGE_REPO }}:${{ github.sha }}"
          READY="$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.latestReadyRevisionName)')"
          IMAGE="$(gcloud run revisions describe "$READY" --region ${{ env.REGION }} --format 'value(spec.containers[0].image)')"
          SERVING="$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'json(status.traffic)' | python3 -c 'import json,sys; t=json.load(sys.stdin)["status"]["traffic"]; print(",".join(x.get("revisionName","")+":"+str(x.get("percent",0)) for x in t if x.get("percent")))')"
          echo "ready=${READY} image=${IMAGE} serving=${SERVING}"
          [ "$IMAGE" = "$WANT" ] || { echo "::error::稼働リビジョンのイメージが ${{ github.sha }} ではない"; exit 1; }
          [ "$SERVING" = "${READY}:100" ] || { echo "::error::通信の100%が最新リビジョン ${READY} に向いていない（${SERVING}）"; exit 1; }
          echo "### 本番の稼働：${READY}（${{ github.sha }}、100%）" >> "$GITHUB_STEP_SUMMARY"
