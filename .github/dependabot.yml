version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Node 25 までの奇数の版（23・25）は LTS にならずサポートが半年で終わるので上げない
    # （27 からはすべての版が LTS になる。https://github.com/nodejs/Release）
    # （ai-dev-harness/policies/dependencies.md。2026-10-24 月ねこが承認）
    ignore:
      - dependency-name: node
        versions: [">= 23, < 24", ">= 25, < 26"]
